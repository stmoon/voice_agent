[project]
name = "voice-bridge"
version = "0.1.0"
description = "휴대폰 음성 대화 → Claude Code RC 세션 MCP 브리지"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2",
    "keyring>=25",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
voice-bridge = "bridge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
junit_family = "xunit1"
markers = [
    "req(id): 노션 요구사항 ID ([P1-2] 등) 와 연결되는 인수 테스트",
    "live: 실제 claude CLI(로그인 필요)를 띄우는 테스트. VC_LIVE=1 일 때만 실행",
]
